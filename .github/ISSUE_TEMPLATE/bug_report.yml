name: Bug report
description: Report a production-impacting defect or reliability issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, how often, and what business or user outcome is blocked?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include environment, browser/device, account state, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Evidence
      description: Add screenshots, logs, request ids, or failing test output when available.
